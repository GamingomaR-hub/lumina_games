<!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 left-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- FIREBASE AUTHENTICATION SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signOut, 
            onAuthStateChanged, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendPasswordResetEmail,
            sendEmailVerification 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJtNlBh_wQXRkKcoF80FDj0QSQb9BITHU",
            authDomain: "lumina-games-ab477.firebaseapp.com",
            projectId: "lumina-games-ab477",
            storageBucket: "lumina-games-ab477.firebasestorage.app",
            messagingSenderId: "1071069150146",
            appId: "1:1071069150146:web:705d40455506968ba3345b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.languageCode = 'ar';

        // متابعة حالة المستخدم
        onAuthStateChanged(auth, (user) => {
            const container = document.getElementById('auth-container');
            if (!container) return;

            if (user) {
                const name = user.email.split('@')[0];
                container.innerHTML = `
                    <div class="flex items-center gap-3 bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl">
                        <div class="w-7 h-7 rounded-lg bg-lumina-purple flex items-center justify-center text-xs font-bold text-white">
                            ${name.charAt(0).toUpperCase()}
                        </div>
                        <span class="text-xs text-white font-bold max-w-[100px] truncate">${name}</span>
                        <button onclick="logoutUser()" title="تسجيل الخروج" class="text-slate-400 hover:text-rose-400 text-xs transition-colors">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="toggleModal('modal-login')" class="px-4 py-2 bg-lumina-violet hover:bg-lumina-purple text-white text-xs font-bold rounded-xl transition-all shadow-lg shadow-lumina-violet/20">
                        تسجيل الدخول
                    </button>
                `;
            }
        });

        // دالة تسجيل الدخول
        window.loginUser = function() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            if (!email || !pass) {
                showToast("يرجى إدخال البريد الإلكتروني وكلمة المرور", "error");
                return;
            }

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    showToast("تم تسجيل الدخول بنجاح!", "success");
                    toggleModal('modal-login');
                    document.getElementById('login-password').value = '';
                })
                .catch((error) => {
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                        showToast("بيانات الدخول غير صحيحة، يرجى التأكد من الإيميل وكلمة السر", "error");
                    } else if (error.code === 'auth/invalid-email') {
                        showToast("صيغة البريد الإلكتروني غير صحيحة", "error");
                    } else {
                        showToast("حدث خطأ: " + error.message, "error");
                    }
                });
        };

        // دالة إنشاء الحساب
        window.registerUser = function() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            if (!email || !pass) {
                showToast("يرجى ملء الحقول لإنشاء الحساب", "error");
                return;
            }

            if (pass.length < 6) {
                showToast("كلمة المرور يجب أن لا تقل عن 6 خانات", "error");
                return;
            }

            createUserWithEmailAndPassword(auth, email, pass)
                .then((cred) => {
                    showToast("تم إنشاء الحساب وتسجيل الدخول بنجاح!", "success");
                    toggleModal('modal-login');
                    document.getElementById('login-password').value = '';
                })
                .catch((error) => {
                    if (error.code === 'auth/email-already-in-use') {
                        showToast("هذا البريد مسجل مسبقاً، يمكنك تسجيل الدخول مباشرة", "error");
                    } else {
                        showToast("خطأ في التسجيل: " + error.message, "error");
                    }
                });
        };

        // استرجاع كلمة المرور
        window.resetPassword = function() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showToast("اكتب بريدك في الحقل أولاً لاسترجاع كلمة المرور", "error");
                return;
            }
            sendPasswordResetEmail(auth, email)
                .then(() => showToast("تم إرسال رابط التعيين إلى بريدك الإلكتروني", "success"))
                .catch(() => showToast("تعذر إرسال الرابط، تأكد من صحة البريد", "error"));
        };

        // خروج
        window.logoutUser = function() {
            signOut(auth).then(() => showToast("تم تسجيل الخروج", "info"));
        };
    </script>
